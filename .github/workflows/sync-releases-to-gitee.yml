name: Sync Releases to Gitee

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub 源仓库（owner/repo），默认当前仓库"
        required: false
        default: ""
      tag:
        description: "仅同步指定标签（如 v1.4.7），留空则批量同步"
        required: false
        default: ""
      limit:
        description: "最多同步多少个版本（0=不限制）"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync releases to gitee
        env:
          GH_REPO: ${{ inputs.source_repo != '' && inputs.source_repo || github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          SYNC_TAG: ${{ inputs.tag }}
          SYNC_LIMIT: ${{ inputs.limit }}
        run: |
          python .github/scripts/sync_releases_to_gitee.py
