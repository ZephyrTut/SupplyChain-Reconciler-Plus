name: Build and Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '版本标签 (例如: v1.5.0)'
        required: true
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF.Replace('refs/tags/', '')
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version_tag }}'
          } else {
            $version = 'v1.5.0'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build release package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build_release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SupplyChain-Reconciler-Plus-${{ steps.version.outputs.version }}-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: SupplyChain-Reconciler-Plus ${{ steps.version.outputs.version }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256