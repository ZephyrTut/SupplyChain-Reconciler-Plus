name: Build and Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '版本标签 (例如: v1.4.4)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag variable
        id: set_tag
        shell: pwsh
        run: |
          # 安全地设置标签变量（PowerShell 版本）
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.version_tag }}"
          }
          else {
            $tag = "v1.0.0"
          }

          # 清除换行和非法字符
          $cleanTag = ($tag -replace "[`r`n]", "") -replace "[^a-zA-Z0-9._-]", "-"

          "TAG=$cleanTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "tag=$cleanTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using tag: $cleanTag"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SupplyChain-Reconciler-Plus main.py

      - name: Zip artifact
        shell: powershell
        run: |
          $tag = "${{ env.TAG }}"
          Write-Host "Creating package for tag: $tag"
          
          $exe = Join-Path $PWD 'dist\SupplyChain-Reconciler-Plus.exe'
          $zip = Join-Path $PWD "dist\reconciler-$tag-windows.zip"
          
          if (Test-Path $exe) { 
              Compress-Archive -Path $exe -DestinationPath $zip -Force 
              Write-Host "✓ Created zip: $zip"
          }
          else { 
              Write-Error "Executable not found: $exe"
              exit 1 
          }

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          draft: false
          prerelease: false
          files: |
            dist/reconciler-${{ env.TAG }}-windows.zip
            dist/SupplyChain-Reconciler-Plus.exe
          body: |
            # Supply Chain Reconciler Plus ${{ env.TAG }}
            
            ## 📦 下载
            - **reconciler-${{ env.TAG }}-windows.zip**: 包含可执行文件的压缩包
            - **SupplyChain-Reconciler-Plus.exe**: 单个可执行文件
            
            ## 🚀 使用说明
            1. 下载并解压
            2. 双击运行 `SupplyChain-Reconciler-Plus.exe`
            
            ## ⚠️ 注意事项
            - 仅支持 Windows 系统
            - 首次运行时可能需要管理员权限
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}